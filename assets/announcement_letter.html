<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#654654}.letter-scene{height:118px;position:relative;display:grid;place-items:center;isolation:isolate}.halo{position:absolute;width:190px;height:103px;border-radius:50%;background:radial-gradient(ellipse,#ffe6ef 5%,#fff2ec 55%,transparent 74%)}.envelope{width:96px;height:66px;position:relative;border:1.5px solid #d99bb2;border-radius:10px;background:linear-gradient(140deg,#fff9f3,#fbdde8);transform:rotate(-7deg);box-shadow:0 8px 16px #b37a9421;z-index:2}.flap{position:absolute;left:4px;right:4px;top:4px;height:40px;background:#fffaf3;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:4px}.flap:after{content:'';position:absolute;inset:1px;background:linear-gradient(140deg,#fffefa,#fff1f4);clip-path:polygon(0 0,100% 0,50% 98%)}.seal{position:absolute;z-index:2;left:34px;top:25px;display:grid;place-items:center;background:#ba6688;border:3px solid #fff5fa;border-radius:50%;width:27px;height:27px;color:white;font-size:14px}.shine{position:absolute;top:15px;left:calc(50% + 62px);font-size:20px;color:#bc91ba}.heart{position:absolute;left:var(--x);top:var(--y);color:var(--color);font-size:var(--size);opacity:.8;user-select:none;pointer-events:none}.caption{position:absolute;bottom:0;font-size:10px;letter-spacing:.18em;color:#a17d8e;font-weight:650}.spark{position:absolute;left:50%;top:38px;pointer-events:none;color:#ca7598;font-size:13px;z-index:3;animation:float-away 900ms ease-out forwards}@keyframes float-away{from{opacity:.9;transform:translate(0,0) scale(.7)}to{opacity:0;transform:translate(var(--dx),-45px) scale(1.1)}}@media(prefers-reduced-motion:reduce){.spark{display:none;animation:none}}
</style></head><body><div class="letter-scene" aria-hidden="true"><div class="halo"></div><span class="heart" style="--x:calc(50% - 88px);--y:35px;--size:19px;--color:#da8aa7">♡</span><span class="heart" style="--x:calc(50% + 78px);--y:69px;--size:13px;--color:#b593bf">♥</span><div class="envelope"><div class="flap"></div><div class="seal">♥</div></div><span class="shine">✦</span><div class="caption">A LITTLE NOTE FOR YOU</div></div>
<script>
(()=>{'use strict';
 const scene=document.querySelector('.letter-scene'),letter=document.querySelector('.envelope'),hearts=[...document.querySelectorAll('.heart')],motion=matchMedia('(prefers-reduced-motion: reduce)');
 let frame=0,start=0,burstAt=0;
 function tick(t){if(motion.matches||document.hidden){frame=0;return;}start ||= t;const elapsed=(t-start)/1000;letter.style.transform=`translateY(${Math.sin(elapsed*1.4)*2}px) rotate(-7deg)`;hearts.forEach((el,i)=>el.style.transform=`translateY(${Math.sin(elapsed*1.2+i*2)*3}px)`);frame=requestAnimationFrame(tick);}
 function reset(){cancelAnimationFrame(frame);frame=0;letter.style.transform='rotate(-7deg)';hearts.forEach(el=>el.style.transform='');if(!motion.matches&&!document.hidden)frame=requestAnimationFrame(tick);}
 scene.addEventListener('pointerenter',()=>{const now=Date.now();if(motion.matches||now-burstAt<1500)return;burstAt=now;[-30,8,40].forEach(dx=>{const s=document.createElement('span');s.className='spark';s.textContent='♡';s.style.setProperty('--dx',dx+'px');scene.append(s);setTimeout(()=>s.remove(),1000);});});
 motion.addEventListener('change',reset);document.addEventListener('visibilitychange',reset);window.addEventListener('pagehide',()=>cancelAnimationFrame(frame));reset();
})();
</script></body></html>
